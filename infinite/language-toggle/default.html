<!doctype html>
<html lang="en">
<head>

    "variant": "default",
    "requiresJs": "no",
    "interaction": [
      "click",
      "focus"
    ],
    "a11y": {
      "wcag21AA": true,
      "keyboardNav": true,

      "ariaAttributes": true

<style>
body{font-family:'Noto Sans',Arial,Helvetica,sans-serif;font-size:16px;line-height:1.65;color:#333;padding:2rem;background:#fff;margin:0}

a{color:#284162}
h2{font-size:1.375rem;margin:0 0 .5rem}
:focus-visible{outline:2px solid #0535d2;outline-offset:2px}
.wb-inv{position:absolute!important;width:1px;height:1px;margin:0;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
legend.h5,.h5{font-weight:700;font-size:1rem;margin:0 0 .5rem}

.list-inline{list-style:none;margin:0;padding:.5rem 1rem;display:flex;justify-content:flex-end;gap:1rem}
.list-inline a{color:#284162}

</style>
</head>
<body>
<ul class="list-inline" id="wb-lng">
  <li><a href="#" lang="fr" hreflang="fr">Français</a></li>
</ul>
<!-- On the French page, the toggle reads:
<ul class="list-inline" id="wb-lng">
  <li><a href="#" lang="en" hreflang="en">English</a></li>
</ul> -->
<div class="cap">language-toggle default</div>
</body>
</html>
